# Railway health check: /healthz runs public/healthz.php through PHP-FPM
# (Railway rejects health-check paths that contain a dot).
location = /healthz {
    access_log off;
    include /etc/nginx/server.conf.d/php-fpm/www.conf;
    include /etc/nginx/sites.enabled/freescout/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/healthz.php;
    fastcgi_param SCRIPT_NAME /healthz.php;
}
